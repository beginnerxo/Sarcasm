name: Keep Streamlit App Alive

on:
  schedule:
    # Runs at minute 0 of every 6th hour (4 times a day)
    - cron: '0 */6 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping
        run: |
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.0.0 Safari/537.36" -o /dev/null -w "Status Code: %{http_code} | Final URL: %{url_effective}\n" https://isitsarcastic.streamlit.app/
